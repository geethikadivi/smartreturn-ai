services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartreturn-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SUPABASE_URL=${SUPABASE_URL:-https://duibmlerhaskjrfqgigx.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1aWJtbGVyaGFza2pyZnFnaWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODAyODEsImV4cCI6MjEwOTU1NjI4MX0.Xnx2JzB3cWhKSejBykyjFavmuymUp2mFWcJn6iCNqQ4}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6KsfJgZRnWy-qrOJc96OBI0gIMPS2altE-oa-gp2nGSmw}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://duibmlerhaskjrfqgigx.supabase.co}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1aWJtbGVyaGFza2pyZnFnaWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODAyODEsImV4cCI6MjEwOTU1NjI4MX0.Xnx2JzB3cWhKSejBykyjFavmuymUp2mFWcJn6iCNqQ4}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: smartreturn-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
